name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Проверка кода (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Компиляция модулей
        run: python -m compileall -q app alembic

  test:
    name: Тесты и миграции
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clickrent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: testing
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/clickrent
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/clickrent_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/15
      SECRET_KEY: ci-secret-key-not-for-production-use-only
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Миграции на чистой БД
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE clickrent"
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Тесты
        run: pytest app/tests -q

  docker:
    name: Docker-стек (2 реплики API) и smoke-тест
    runs-on: ubuntu-latest
    needs: test
    env:
      APP_IMAGE: clickrent-api:ci
      HTTP_PORT: "8080"
      WEB_CONCURRENCY: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Сборка образа
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.APP_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Запуск стека (PostgreSQL, Redis, 2 реплики API по 2 воркера, nginx)
        run: |
          cp .env.example .env
          docker compose up -d --no-build --scale app=2 --wait --wait-timeout 180

      - name: Smoke-тест через nginx
        run: |
          pip install httpx==0.28.1 websockets==17.1 pillow==12.3.0
          python scripts/smoke_test.py http://localhost:${HTTP_PORT}

      - name: Логи стека
        if: failure()
        run: docker compose logs

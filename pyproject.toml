[tool.ruff]
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Синтаксические ошибки и pyflakes: неопределенные имена, переопределения, неиспользуемые переменные
select = ["E9", "F"]
# Неиспользуемые импорты не блокируют CI
ignore = ["F401"]

[tool.ruff.lint.per-file-ignores]
# relationship-аннотации SQLAlchemy ссылаются на модели строками (Mapped["User"])
"app/models/*" = ["F821"]

[tool.pytest.ini_options]
# Пакет app импортируется из корня репозитория (у каталога app нет __init__.py)
pythonpath = ["."]
